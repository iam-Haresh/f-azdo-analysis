# Service connection type -> suggested GitLab replacement (reports: service_connections sheet, briefs).

default: "Masked (and protected) CI/CD variables holding the endpoint URL and credentials"

types:
  azurerm: "OIDC: id_tokens + Azure workload identity federation (az login --federated-token); else masked service-principal variables"
  azure: "OIDC: id_tokens + Azure workload identity federation; else masked variables"
  aws: "OIDC: id_tokens + AWS IAM role (assume-role-with-web-identity); else masked access keys"
  kubernetes: "GitLab agent for Kubernetes (KUBE_CONTEXT), or a kubeconfig file-type variable"
  openshift: "Service-account token as a masked variable (oc login --token), or the GitLab agent for Kubernetes"
  dockerregistry: "DOCKER_AUTH_CONFIG or masked registry user/token variables; CI_JOB_TOKEN for the GitLab registry"
  azurecontainerregistry: "OIDC login to ACR, or masked registry credentials"
  ssh: "SSH private key as a file-type masked variable + known_hosts variable"
  generic: "Masked CI/CD variables (URL, user, token)"
  git: "Deploy token / project access token, or CI_JOB_TOKEN for same-instance repositories"
  github: "GitHub token as a masked variable (or repository mirroring)"
  githubenterprise: "GitHub token as a masked variable (or repository mirroring)"
  bitbucket: "App password / access token as a masked variable"
  externalmavenrepository: "settings.xml as a file-type variable"
  externalnpmregistry: ".npmrc auth token as a masked variable"
  externalnugetfeed: "NuGet source credentials as masked variables"
  externalpythonuploadfeed: "TWINE_USERNAME / TWINE_PASSWORD masked variables"
  externalpythondownloadfeed: "PIP_INDEX_URL with credentials as a masked variable"
  sonarqube: "SONAR_HOST_URL and SONAR_TOKEN CI/CD variables"
  sonarcloud: "SONAR_TOKEN CI/CD variable"
  artifactoryservice: "JFrog URL + access token as masked variables (jf c add)"
  jfrogartifactoryservice: "JFrog URL + access token as masked variables (jf c add)"
  jfrogplatformservice: "JFrog URL + access token as masked variables (jf c add)"
  nexus: "Nexus URL + user/token as masked variables"
  jenkins: "Jenkins URL + API token as masked variables (trigger through curl)"
  servicefabric: "Cluster certificate as a file-type variable"
  azureservicebus: "Connection string as a masked variable"
  chef: "Chef server URL + client key as file-type variable"
  whitesource: "Mend API key as a masked variable (or GitLab Dependency Scanning)"
