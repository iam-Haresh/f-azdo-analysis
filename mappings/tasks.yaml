# AZDO task -> GitLab CI/CD mapping (spec section 13.2). Seed file: extend it from the
# "Unmapped tasks" report. `task` is an exact name (case-insensitive) or a `re:` pattern.
# Fields: versions ("*" or a list of majors), gitlab {approach, image, script_hint, keywords, notes},
# runner_os (any | linux | windows | macos), stage (see stage_order), confidence.

stage_order: [prepare, build, test, scan, package, publish, deploy, verify]
default_stage: build

tasks:
  # -- scripts and files ---------------------------------------------------------
  - { task: CmdLine, stage: build, gitlab: { approach: script, script_hint: "paste the commands into script:", keywords: [script], notes: "cmd.exe syntax needs porting to sh unless the job stays on a Windows runner" } }
  - { task: Bash, stage: build, gitlab: { approach: script, script_hint: "script: lines", keywords: [script] } }
  - { task: PowerShell, stage: build, gitlab: { approach: script, image: "mcr.microsoft.com/powershell:lts", script_hint: "pwsh -File ./script.ps1", keywords: [script], notes: "Windows PowerShell 5 scripts may need a Windows runner" } }
  - { task: BatchScript, runner_os: windows, stage: build, gitlab: { approach: script, script_hint: "call script.bat", keywords: [script, tags] } }
  - { task: ShellScript, stage: build, gitlab: { approach: script, script_hint: "sh ./script.sh", keywords: [script] } }
  - { task: PythonScript, stage: build, gitlab: { approach: script, image: "python:3.12", script_hint: "python script.py", keywords: [script, image] } }
  - { task: CopyFiles, stage: build, gitlab: { approach: script, script_hint: "cp -r / rsync, or just list the paths under artifacts:paths", keywords: [script, "artifacts:paths"], notes: "usually disappears: GitLab artifacts take paths directly" } }
  - { task: DeleteFiles, stage: build, gitlab: { approach: script, script_hint: "rm -rf", keywords: [script] } }
  - { task: ArchiveFiles, stage: package, gitlab: { approach: script, script_hint: "zip -r / tar czf", keywords: [script] } }
  - { task: ExtractFiles, stage: prepare, gitlab: { approach: script, script_hint: "unzip / tar xzf", keywords: [script] } }
  - { task: Checkout, stage: prepare, gitlab: { approach: built-in, keywords: [GIT_STRATEGY, GIT_DEPTH, GIT_SUBMODULE_STRATEGY], notes: "checkout is implicit; extra repos need git clone with CI_JOB_TOKEN or a multi-project setup" } }
  - { task: Template, stage: build, gitlab: { approach: include, keywords: ["include:project", "include:local", "include:component"], notes: "template could not be resolved statically; migrate it as a shared include / CI component" } }

  # -- artifacts -----------------------------------------------------------------
  - { task: PublishBuildArtifacts, stage: package, gitlab: { approach: keyword, keywords: ["artifacts:paths", "artifacts:expire_in"] } }
  - { task: PublishPipelineArtifact, stage: package, gitlab: { approach: keyword, keywords: ["artifacts:paths", "artifacts:expire_in"] } }
  - { task: DownloadBuildArtifacts, stage: prepare, gitlab: { approach: keyword, keywords: ["needs:artifacts", "needs:project"], notes: "cross-project downloads use needs:project or the job artifacts API" } }
  - { task: DownloadPipelineArtifact, stage: prepare, gitlab: { approach: keyword, keywords: ["needs:artifacts", dependencies] } }
  - { task: DownloadPackage, stage: prepare, gitlab: { approach: script, script_hint: "curl / package manager from the target artifact repository", keywords: [script] } }
  - { task: UniversalPackages, stage: publish, gitlab: { approach: script, script_hint: "generic package upload (curl --upload-file) to the artifact repository", keywords: [script] } }
  - { task: PublishSymbols, runner_os: windows, stage: publish, gitlab: { approach: script, script_hint: "symstore / dotnet symbol push", keywords: [script], notes: "no built-in symbol server in GitLab" } }

  # -- test and coverage reporting -----------------------------------------------
  - { task: PublishTestResults, stage: test, gitlab: { approach: keyword, keywords: ["artifacts:reports:junit"], notes: "TRX / NUnit / xUnit results must be converted to JUnit XML (e.g. trx2junit, --logger junit)" } }
  - { task: PublishCodeCoverageResults, stage: test, gitlab: { approach: keyword, keywords: [coverage, "artifacts:reports:coverage_report"], notes: "emit Cobertura XML and set a coverage regex" } }

  # -- .NET ----------------------------------------------------------------------
  - { task: DotNetCoreCLI, stage: build, gitlab: { approach: script, image: "mcr.microsoft.com/dotnet/sdk:8.0", script_hint: "dotnet restore && dotnet build -c Release && dotnet test && dotnet publish", keywords: [script, cache, "artifacts:reports:junit"] } }
  - { task: UseDotNet, stage: prepare, gitlab: { approach: image, image: "mcr.microsoft.com/dotnet/sdk:<version>", keywords: [image], notes: "choose the SDK through the job image instead of installing it" } }
  - { task: DotNetCoreInstaller, stage: prepare, gitlab: { approach: image, image: "mcr.microsoft.com/dotnet/sdk:<version>", keywords: [image] } }
  - { task: VSBuild, runner_os: windows, stage: build, gitlab: { approach: script, script_hint: "msbuild Solution.sln /p:Configuration=Release", keywords: [script, tags], notes: "needs a Windows runner with Visual Studio Build Tools" } }
  - { task: MSBuild, runner_os: windows, stage: build, gitlab: { approach: script, script_hint: "msbuild Project.csproj /p:Configuration=Release", keywords: [script, tags], notes: "SDK-style projects can use `dotnet msbuild` on Linux instead" } }
  - { task: VSTest, runner_os: windows, stage: test, gitlab: { approach: script, script_hint: "vstest.console.exe **\\*Tests.dll /logger:trx", keywords: [script, tags, "artifacts:reports:junit"], notes: "convert TRX to JUnit; prefer `dotnet test` where possible" } }
  - { task: VisualStudioTestPlatformInstaller, runner_os: windows, stage: prepare, gitlab: { approach: runner, notes: "install the test platform on the Windows runner image" } }
  - { task: NuGetCommand, stage: build, gitlab: { approach: script, script_hint: "nuget restore / dotnet restore; nuget push to the artifact repository", keywords: [script, cache], notes: "packages.config restore of .NET Framework solutions needs nuget.exe on Windows (or mono)" } }
  - { task: NuGetInstaller, stage: build, gitlab: { approach: script, script_hint: "nuget restore", keywords: [script] } }
  - { task: NuGetRestore, stage: build, gitlab: { approach: script, script_hint: "nuget restore", keywords: [script] } }
  - { task: NuGetToolInstaller, stage: prepare, gitlab: { approach: runner, notes: "bake nuget.exe into the runner image" } }
  - { task: NuGetPublisher, stage: publish, gitlab: { approach: script, script_hint: "nuget push *.nupkg -Source <feed>", keywords: [script] } }
  - { task: NuGetAuthenticate, stage: prepare, gitlab: { approach: variables, script_hint: "dotnet nuget add source --username $USER --password $TOKEN", keywords: [variables], notes: "feed credentials become masked CI/CD variables; CI_JOB_TOKEN works for the GitLab registry" } }

  # -- Java ----------------------------------------------------------------------
  - { task: Maven, stage: build, gitlab: { approach: script, image: "maven:3.9-eclipse-temurin-17", script_hint: "mvn $MAVEN_CLI_OPTS verify", keywords: [script, cache, "artifacts:reports:junit"], notes: "settings.xml with repository credentials comes from a file-type variable" } }
  - { task: Gradle, stage: build, gitlab: { approach: script, image: "gradle:8-jdk17", script_hint: "./gradlew build", keywords: [script, cache, "artifacts:reports:junit"] } }
  - { task: Ant, stage: build, gitlab: { approach: script, image: "eclipse-temurin:17-jdk", script_hint: "ant -f build.xml", keywords: [script] } }
  - { task: JavaToolInstaller, stage: prepare, gitlab: { approach: image, keywords: [image], notes: "choose the JDK through the job image" } }
  - { task: MavenAuthenticate, stage: prepare, gitlab: { approach: variables, keywords: [variables], notes: "settings.xml as a file-type CI/CD variable (mvn -s $MAVEN_SETTINGS)" } }

  # -- JavaScript ----------------------------------------------------------------
  - { task: Npm, stage: build, gitlab: { approach: script, image: "node:20", script_hint: "npm ci && npm run build", keywords: [script, cache] } }
  - { task: NodeTool, stage: prepare, gitlab: { approach: image, image: "node:<version>", keywords: [image] } }
  - { task: UseNode, stage: prepare, gitlab: { approach: image, image: "node:<version>", keywords: [image] } }
  - { task: npmAuthenticate, stage: prepare, gitlab: { approach: variables, script_hint: "echo \"//registry/:_authToken=${NPM_TOKEN}\" > .npmrc", keywords: [variables] } }
  - { task: "re:(?i)^yarn", stage: build, gitlab: { approach: script, image: "node:20", script_hint: "yarn install --frozen-lockfile && yarn build", keywords: [script, cache] } }
  - { task: Grunt, stage: build, gitlab: { approach: script, image: "node:20", script_hint: "npx grunt", keywords: [script] } }
  - { task: Gulp, stage: build, gitlab: { approach: script, image: "node:20", script_hint: "npx gulp", keywords: [script] } }

  # -- Python / Go ---------------------------------------------------------------
  - { task: UsePythonVersion, stage: prepare, gitlab: { approach: image, image: "python:<version>", keywords: [image] } }
  - { task: PipAuthenticate, stage: prepare, gitlab: { approach: variables, script_hint: "PIP_INDEX_URL=https://$USER:$TOKEN@host/simple", keywords: [variables] } }
  - { task: TwineAuthenticate, stage: publish, gitlab: { approach: variables, script_hint: "twine upload -u $USER -p $TOKEN --repository-url <url> dist/*", keywords: [variables, script] } }
  - { task: Go, stage: build, gitlab: { approach: script, image: "golang:1.22", script_hint: "go build ./... && go test ./...", keywords: [script, cache] } }
  - { task: GoTool, stage: prepare, gitlab: { approach: image, image: "golang:<version>", keywords: [image] } }
  - { task: CMake, stage: build, gitlab: { approach: script, image: "gcc:13", script_hint: "cmake -B build && cmake --build build", keywords: [script] } }

  # -- mobile --------------------------------------------------------------------
  - { task: Xcode, runner_os: macos, stage: build, gitlab: { approach: script, script_hint: "xcodebuild / fastlane", keywords: [script, tags], notes: "needs a macOS runner" } }
  - { task: XamarinAndroid, runner_os: windows, stage: build, gitlab: { approach: script, script_hint: "msbuild /t:SignAndroidPackage", keywords: [script, tags] } }
  - { task: XamariniOS, runner_os: macos, stage: build, gitlab: { approach: script, script_hint: "msbuild /p:Platform=iPhone", keywords: [script, tags] } }
  - { task: InstallAppleCertificate, runner_os: macos, stage: prepare, gitlab: { approach: variables, keywords: ["Secure Files"], notes: "certificate from project Secure Files, imported into a temporary keychain" } }
  - { task: InstallAppleProvisioningProfile, runner_os: macos, stage: prepare, gitlab: { approach: variables, keywords: ["Secure Files"] } }
  - { task: AndroidSigning, stage: package, gitlab: { approach: script, script_hint: "apksigner sign --ks $KEYSTORE", keywords: [script, "Secure Files"] } }
  - { task: AppCenterDistribute, stage: deploy, gitlab: { approach: script, script_hint: "appcenter distribute release", keywords: [script, environment] } }
  - { task: "re:(?i)^GooglePlay", stage: deploy, gitlab: { approach: script, script_hint: "fastlane supply", keywords: [script, environment] } }
  - { task: "re:(?i)^AppStore", runner_os: macos, stage: deploy, gitlab: { approach: script, script_hint: "fastlane deliver / pilot", keywords: [script, environment] } }

  # -- containers ----------------------------------------------------------------
  - { task: Docker, stage: package, gitlab: { approach: script, image: "docker:27", script_hint: "docker build -t $IMAGE . && docker push $IMAGE (or kaniko / buildah)", keywords: [script, services, variables], notes: "needs docker:dind service or a rootless builder; registry login from CI/CD variables" } }
  - { task: DockerCompose, stage: build, gitlab: { approach: script, image: "docker:27", script_hint: "docker compose up -d / build", keywords: [script, services] } }
  - { task: DockerInstaller, stage: prepare, gitlab: { approach: image, image: "docker:27", keywords: [image] } }
  - { task: ECRPushImage, stage: publish, gitlab: { approach: script, script_hint: "aws ecr get-login-password | docker login; docker push", keywords: [script, id_tokens] } }

  # -- secrets and files ---------------------------------------------------------
  - { task: DownloadSecureFile, stage: prepare, gitlab: { approach: variables, script_hint: "download-secure-files (project Secure Files) or a file-type variable", keywords: ["Secure Files", variables] } }
  - { task: InstallSSHKey, stage: prepare, gitlab: { approach: variables, script_hint: "eval $(ssh-agent -s); ssh-add <(echo \"$SSH_PRIVATE_KEY\")", keywords: [variables, before_script] } }
  - { task: AzureKeyVault, stage: prepare, gitlab: { approach: secrets, keywords: [secrets, id_tokens], notes: "use the secrets: keyword (Azure Key Vault / Vault) or fetch with an ID token" } }

  # -- code quality and security -------------------------------------------------
  - { task: SonarQubePrepare, stage: scan, gitlab: { approach: script, script_hint: "sonar-scanner / mvn sonar:sonar / dotnet sonarscanner begin", keywords: [script, variables], notes: "SONAR_HOST_URL and SONAR_TOKEN as CI/CD variables; consider GitLab SAST" } }
  - { task: SonarQubeAnalyze, stage: scan, gitlab: { approach: script, script_hint: "sonar-scanner (or dotnet sonarscanner end)", keywords: [script] } }
  - { task: SonarQubePublish, stage: scan, gitlab: { approach: script, script_hint: "-Dsonar.qualitygate.wait=true", keywords: [script], notes: "quality gate result fails the job directly" } }
  - { task: "re:(?i)^SonarCloud", stage: scan, gitlab: { approach: script, script_hint: "sonar-scanner", keywords: [script, variables] } }
  - { task: "re:(?i)whitesource|^mend", stage: scan, gitlab: { approach: template, keywords: ["include:template"], notes: "replace with GitLab Dependency Scanning or run the Mend unified agent in a job" } }
  - { task: "re:(?i)dependency-?check", stage: scan, gitlab: { approach: template, keywords: ["include:template"], notes: "replace with GitLab Dependency Scanning" } }
  - { task: "re:(?i)credscan", stage: scan, gitlab: { approach: template, keywords: ["include:template"], notes: "replace with GitLab Secret Detection" } }

  # -- config transformation -----------------------------------------------------
  - { task: FileTransform, stage: deploy, gitlab: { approach: script, script_hint: "envsubst / yq / jq / xmlstarlet", keywords: [script, variables], notes: "XML transform and JSON variable substitution have no built-in equivalent - needs an explicit replacement" } }
  - { task: "re:(?i)replace-?tokens", stage: deploy, gitlab: { approach: script, script_hint: "envsubst < file.tpl > file", keywords: [script, variables] } }
  - { task: MagicChunks, stage: deploy, gitlab: { approach: script, script_hint: "yq / jq / xmlstarlet", keywords: [script] } }

  # -- agentless / flow control --------------------------------------------------
  - { task: ManualIntervention, stage: deploy, gitlab: { approach: keyword, keywords: ["when: manual", "environment", "protected environments"] } }
  - { task: ManualValidation, stage: deploy, gitlab: { approach: keyword, keywords: ["when: manual", "deployment approvals"] } }
  - { task: InvokeRESTAPI, stage: verify, gitlab: { approach: script, image: "curlimages/curl", script_hint: "curl --fail -X POST $URL", keywords: [script] } }
  - { task: Delay, stage: deploy, gitlab: { approach: keyword, keywords: ["when: delayed", start_in] } }
  - { task: AzureFunction, stage: verify, gitlab: { approach: script, script_hint: "curl the function endpoint", keywords: [script] } }
  - { task: queryWorkItems, stage: verify, gitlab: { approach: script, notes: "work-item query gate: script against the GitLab issues API or an external status check" } }

  # -- Azure deployments ---------------------------------------------------------
  - { task: AzureCLI, stage: deploy, gitlab: { approach: script, image: "mcr.microsoft.com/azure-cli", script_hint: "az login --federated-token $ID_TOKEN ...; az ...", keywords: [script, id_tokens, environment] } }
  - { task: AzurePowerShell, stage: deploy, gitlab: { approach: script, image: "mcr.microsoft.com/azure-powershell", script_hint: "Connect-AzAccount -FederatedToken ...", keywords: [script, id_tokens] } }
  - { task: AzureWebApp, stage: deploy, gitlab: { approach: script, image: "mcr.microsoft.com/azure-cli", script_hint: "az webapp deploy --src-path app.zip", keywords: [script, environment, id_tokens] } }
  - { task: AzureRmWebAppDeployment, stage: deploy, gitlab: { approach: script, image: "mcr.microsoft.com/azure-cli", script_hint: "az webapp deploy / az webapp deployment slot swap", keywords: [script, environment], notes: "built-in XML/JSON substitution must be replaced explicitly" } }
  - { task: AzureWebAppContainer, stage: deploy, gitlab: { approach: script, image: "mcr.microsoft.com/azure-cli", script_hint: "az webapp config container set", keywords: [script, environment] } }
  - { task: AzureAppServiceManage, stage: deploy, gitlab: { approach: script, image: "mcr.microsoft.com/azure-cli", script_hint: "az webapp start|stop|deployment slot swap", keywords: [script, environment] } }
  - { task: AzureFunctionApp, stage: deploy, gitlab: { approach: script, image: "mcr.microsoft.com/azure-cli", script_hint: "az functionapp deployment source config-zip", keywords: [script, environment] } }
  - { task: AzureFunctionAppContainer, stage: deploy, gitlab: { approach: script, image: "mcr.microsoft.com/azure-cli", script_hint: "az functionapp config container set", keywords: [script, environment] } }
  - { task: AzureResourceManagerTemplateDeployment, stage: deploy, gitlab: { approach: script, image: "mcr.microsoft.com/azure-cli", script_hint: "az deployment group create --template-file", keywords: [script, environment] } }
  - { task: AzureResourceGroupDeployment, stage: deploy, gitlab: { approach: script, image: "mcr.microsoft.com/azure-cli", script_hint: "az deployment group create", keywords: [script, environment] } }
  - { task: AzureFileCopy, runner_os: windows, stage: deploy, gitlab: { approach: script, script_hint: "azcopy copy / az storage blob upload-batch", keywords: [script], notes: "the task is Windows-only; azcopy itself runs on Linux" } }
  - { task: SqlAzureDacpacDeployment, runner_os: windows, stage: deploy, gitlab: { approach: script, script_hint: "sqlpackage /Action:Publish /SourceFile:db.dacpac", keywords: [script, environment], notes: "sqlpackage is also available for Linux" } }
  - { task: ServiceFabricDeploy, runner_os: windows, stage: deploy, gitlab: { approach: script, script_hint: "Connect-ServiceFabricCluster; Publish-NewServiceFabricApplication", keywords: [script, tags] } }

  # -- Kubernetes / OpenShift / Helm ---------------------------------------------
  - { task: Kubernetes, stage: deploy, gitlab: { approach: script, image: "bitnami/kubectl", script_hint: "kubectl apply -f k8s/", keywords: [script, environment], notes: "use the GitLab agent for Kubernetes (KUBE_CONTEXT) or a kubeconfig variable" } }
  - { task: Kubectl, stage: deploy, gitlab: { approach: script, image: "bitnami/kubectl", script_hint: "kubectl ...", keywords: [script, environment] } }
  - { task: KubernetesManifest, stage: deploy, gitlab: { approach: script, image: "bitnami/kubectl", script_hint: "kubectl apply -f manifests/ && kubectl rollout status", keywords: [script, environment] } }
  - { task: KubectlInstaller, stage: prepare, gitlab: { approach: image, image: "bitnami/kubectl", keywords: [image] } }
  - { task: HelmDeploy, stage: deploy, gitlab: { approach: script, image: "alpine/helm:3", script_hint: "helm upgrade --install $RELEASE ./chart -n $NAMESPACE", keywords: [script, environment] } }
  - { task: HelmInstaller, stage: prepare, gitlab: { approach: image, image: "alpine/helm:3", keywords: [image] } }
  - { task: "re:(?i)^oc(cmd|setup)?$|openshift", stage: deploy, gitlab: { approach: script, image: "quay.io/openshift/origin-cli", script_hint: "oc login --token=$OC_TOKEN; oc apply -f ...", keywords: [script, environment, variables] } }

  # -- VM / IIS deployments ------------------------------------------------------
  - { task: "re:(?i)^IISWebApp", runner_os: windows, stage: deploy, gitlab: { approach: script, script_hint: "msdeploy / WebAdministration PowerShell on the target", keywords: [script, tags, environment], notes: "deployment-group task: needs a runner on the target VM or WinRM/Ansible from a runner" } }
  - { task: WindowsMachineFileCopy, runner_os: windows, stage: deploy, gitlab: { approach: script, script_hint: "robocopy / Copy-Item -ToSession", keywords: [script, tags] } }
  - { task: PowerShellOnTargetMachines, runner_os: windows, stage: deploy, gitlab: { approach: script, script_hint: "Invoke-Command -ComputerName ...", keywords: [script, tags], notes: "WinRM from a Windows runner, or Ansible win_* modules" } }
  - { task: SqlDacpacDeploymentOnMachineGroup, runner_os: windows, stage: deploy, gitlab: { approach: script, script_hint: "sqlpackage /Action:Publish", keywords: [script, tags, environment] } }
  - { task: SSH, stage: deploy, gitlab: { approach: script, script_hint: "ssh user@host 'commands'", keywords: [script, before_script, variables], notes: "private key as a file-type/masked variable" } }
  - { task: CopyFilesOverSSH, stage: deploy, gitlab: { approach: script, script_hint: "scp / rsync -e ssh", keywords: [script, variables] } }
  - { task: FtpUpload, stage: deploy, gitlab: { approach: script, script_hint: "lftp / curl -T", keywords: [script, variables] } }
  - { task: "re:(?i)^ansible", stage: deploy, gitlab: { approach: script, image: "quay.io/ansible/ansible-runner", script_hint: "ansible-playbook -i inventory site.yml", keywords: [script, variables, environment] } }

  # -- AWS -----------------------------------------------------------------------
  - { task: "re:^(AWSCLI|AWSShellScript|AWSPowerShellModuleScript)$", stage: deploy, gitlab: { approach: script, image: "amazon/aws-cli", script_hint: "aws sts assume-role-with-web-identity (OIDC), then aws ...", keywords: [script, id_tokens] } }
  - { task: S3Upload, stage: deploy, gitlab: { approach: script, image: "amazon/aws-cli", script_hint: "aws s3 sync ./dist s3://bucket", keywords: [script, id_tokens] } }
  - { task: LambdaDeployFunction, stage: deploy, gitlab: { approach: script, image: "amazon/aws-cli", script_hint: "aws lambda update-function-code", keywords: [script, id_tokens, environment] } }
  - { task: "re:^CloudFormation", stage: deploy, gitlab: { approach: script, image: "amazon/aws-cli", script_hint: "aws cloudformation deploy --template-file", keywords: [script, id_tokens, environment] } }

  # -- IaC -----------------------------------------------------------------------
  - { task: "re:(?i)^terraform", stage: deploy, gitlab: { approach: script, image: "hashicorp/terraform:1.9", script_hint: "terraform init && terraform plan -out plan && terraform apply plan", keywords: [script, "artifacts:reports:terraform", environment], notes: "use the GitLab-managed Terraform/OpenTofu state backend or keep the existing backend" } }

  # -- JFrog / Artifactory -------------------------------------------------------
  - { task: "re:(?i)^(JFrog|Artifactory)", stage: publish, gitlab: { approach: script, image: "releases-docker.jfrog.io/jfrog/jfrog-cli-v2-jf", script_hint: "jf rt upload / jf rt download / jf mvn / jf npm", keywords: [script, variables], notes: "server URL and access token as CI/CD variables; build-info via jf rt build-publish" } }
