[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "azdo-analyzer"
version = "0.1.0"
description = "Read-only Azure DevOps pipeline inventory and GitLab CI/CD migration analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "ruamel.yaml>=0.18",
  "typer>=0.12",
  "jinja2>=3.1",
  "openpyxl>=3.1",
  "lxml>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
azdo-analyzer = "azdo_analyzer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/azdo_analyzer"]

[tool.hatch.build.targets.wheel.force-include]
"rules" = "azdo_analyzer/_data/rules"
"mappings" = "azdo_analyzer/_data/mappings"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["azdo_analyzer"]
known-local-folder = ["conftest", "fake_azdo"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["lxml.*", "openpyxl.*", "ruamel.*"]
ignore_missing_imports = true
follow_untyped_imports = false
